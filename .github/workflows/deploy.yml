name: Deploy

on:
  workflow_dispatch:
    inputs:
      skip_pull:
        description: No ejecutar git pull en la VM
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Desplegar en la VM por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            if [ "${{ inputs.skip_pull }}" != "true" ]; then
              git pull --ff-only
            fi
            docker compose up -d --build
            docker compose ps
