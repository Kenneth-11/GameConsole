name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  prolog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar pruebas plunit
        run: |
          docker run --rm \
            -v "$PWD/prolog:/app" \
            -w /app \
            swipl:9.2.9 \
            swipl -q -g run_tests -t halt tests.pl

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, prolog]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen web
        run: docker build -t gameconsole-web:ci ./web
      - name: Construir imagen Prolog
        run: docker build -t gameconsole-prolog:ci ./prolog
