name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  prolog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar pruebas plunit
        run: |
          docker run --rm \
            -v "$PWD/prolog:/app" \
            -w /app \
            swipl:9.2.9 \
            swipl -q -g run_tests -t halt tests.pl

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [web, prolog]
    env:
      BASE_URL: http://localhost:8088
      WEB_PORT: "8088"
      GAMESTATS_REPOSITORY: https://github.com/Kenneth-11/gamestats.git
      GAMESTATS_REF: feature/gameconsole-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clonar GameStats integrado
        run: |
          git clone --depth 1 --branch "$GAMESTATS_REF" \
            "$GAMESTATS_REPOSITORY" ../GameStats
      - name: Validar configuración de Docker Compose
        run: docker compose config --quiet
      - name: Construir stack integrado
        run: docker compose build
      - name: Levantar stack integrado
        run: docker compose up -d --wait
      - name: Esperar servicios HTTP
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE_URL/healthz" >/dev/null \
              && curl -fsS "$BASE_URL/api/health" >/dev/null \
              && curl -fsS "$BASE_URL/prolog/health" >/dev/null; then
              echo "Servicios listos"
              exit 0
            fi
            sleep 2
          done
          echo "Los servicios no respondieron a tiempo"
          docker compose ps
          exit 1
      - name: Ejecutar smoke test integrado
        run: node scripts/smoke.mjs
      - name: Mostrar logs si falla
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Detener stack
        if: always()
        run: docker compose down -v --remove-orphans
